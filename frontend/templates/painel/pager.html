<div class="row pager">
  {% if page.has_previous %}<a class="btn" href="?page={{ page.previous_page_number }}{% if q %}&q={{ q }}{% endif %}">« Anterior</a>{% endif %}
  <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn" href="?page={{ page.next_page_number }}{% if q %}&q={{ q }}{% endif %}">Próxima »</a>{% endif %}
</div>
