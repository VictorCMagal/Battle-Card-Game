{% extends "painel/base_painel.html" %}
{% block body %}
<h1>{{ title }}</h1>
<table class="table"><thead><tr><th>card_uid</th><th>Card_ID</th><th>Nome</th><th>Foil</th><th>Shiny</th></tr></thead>
<tbody>{% for c in cards %}<tr><td>{{ c.card_uid }}</td><td>{{ c.carta_id }}</td><td>{{ c.carta.name }}</td><td>{{ c.is_foil }}</td><td>{{ c.is_shiny }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
